dependencies {
    // JDA
    implementation('net.dv8tion:JDA:4.4.1_DiscordSRV.fix-7') {
        exclude(module: 'opus-java')
    }

    // Config
    implementation('github.scarsz:configuralize:1.3.2') {
        exclude(module: 'json-simple')
        exclude(module: 'snakeyaml')
    }

    // Logging
    implementation('me.scarsz.jdaappender:jda4:1.2.3')
    implementation('org.slf4j:slf4j-jdk14:1.7.36')
    implementation('org.slf4j:jcl-over-slf4j:1.7.36')
    compileOnly('org.apache.logging.log4j:log4j-core:2.0-beta9')

    // adventure
    def adventureVersion = '4.25.0'
    implementation("net.kyori:adventure-api:${adventureVersion}")
    implementation("net.kyori:adventure-text-minimessage:${adventureVersion}")
    implementation("net.kyori:adventure-text-serializer-legacy:${adventureVersion}")
    implementation("net.kyori:adventure-text-serializer-plain:${adventureVersion}")
    implementation("net.kyori:adventure-text-serializer-gson:${adventureVersion}")
    implementation('net.kyori:adventure-platform-bukkit:4.4.0')
    implementation('dev.vankka:mcdiscordreserializer:4.3.0')

    // Annotations
    compileOnlyApi('org.jetbrains:annotations:23.0.0')

    // Lombok
    compileOnly('org.projectlombok:lombok:1.18.38')
    annotationProcessor('org.projectlombok:lombok:1.18.38')

    // Apache Commons, guava
    implementation('commons-io:commons-io:2.11.0')
    implementation('commons-collections:commons-collections:3.2.2')
    implementation('org.apache.commons:commons-lang3:3.12.0')
    implementation('commons-codec:commons-codec:1.15')
    implementation('com.google.guava:guava:31.1-jre')

    // DynamicProxy
    implementation('dev.vankka:dynamicproxy-runtime:1.0.1')
    compileOnly('dev.vankka:dynamicproxy:1.0.1')
    annotationProcessor('dev.vankka:dynamicproxy:1.0.1')

    // MySQL
    compileOnly('mysql:mysql-connector-java:8.0.28')

    // Misc libraries
    implementation('com.vdurmont:emoji-java:5.1.1')
    implementation('org.bstats:bstats-bukkit:2.2.1')
    implementation('com.github.zafarkhaja:java-semver:0.9.0')
    implementation('com.github.kevinsawicki:http-request:6.0')
    implementation('org.minidns:minidns-hla:1.0.4')
    implementation('com.hrakaroo:glob:0.9.0')
    implementation('org.springframework:spring-expression:5.3.16') {
        exclude(module: 'spring-jcl')
    }

    // JUnit
    testImplementation('org.junit.jupiter:junit-jupiter-api:5.14.3')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.14.3')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.14.3')

    compileOnly('com.google.code.findbugs:jsr305:3.0.2')
}
