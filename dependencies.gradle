def forgeEssentialsDistributionConfig = configurations.create('forgeEssentialsDistribution') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

def forgeEssentialsApiJar = tasks.register('forgeEssentialsApiJar', Jar) {
    archiveFileName = 'forgeessentials-api.jar'
    destinationDirectory = layout.buildDirectory.dir('generated/forgeessentials')
    from({ forgeEssentialsDistributionConfig.collect { zipTree(it) } }) {
        include 'com/forgeessentials/**'
        exclude 'com/forgeessentials/thirdparty/**'
    }
}

dependencies {
    // JDA
    shadowImplementation('net.dv8tion:JDA:4.4.1_DiscordSRV.fix-7') {
        exclude(module: 'opus-java')
    }

    // Config
    shadowImplementation('github.scarsz:configuralize:1.3.2') {
        exclude(module: 'json-simple')
        exclude(module: 'snakeyaml')
    }

    // Logging
    shadowImplementation('me.scarsz.jdaappender:jda4:1.2.3')
    shadowImplementation('org.slf4j:slf4j-jdk14:1.7.36')
    shadowImplementation('org.slf4j:jcl-over-slf4j:1.7.36')
    compileOnly('org.apache.logging.log4j:log4j-core:2.0-beta9')

    // adventure
    def adventureVersion = '4.25.0'
    shadowImplementation("net.kyori:adventure-api:${adventureVersion}")
    shadowImplementation("net.kyori:adventure-text-minimessage:${adventureVersion}")
    shadowImplementation("net.kyori:adventure-text-serializer-legacy:${adventureVersion}")
    shadowImplementation("net.kyori:adventure-text-serializer-plain:${adventureVersion}")
    shadowImplementation("net.kyori:adventure-text-serializer-gson:${adventureVersion}")
    shadowImplementation('dev.vankka:mcdiscordreserializer:4.3.0')

    // Annotations
    compileOnlyApi('org.jetbrains:annotations:23.0.0')

    // Lombok
    compileOnly('org.projectlombok:lombok:1.18.38')
    annotationProcessor('org.projectlombok:lombok:1.18.38')

    // Apache Commons, guava
    shadowImplementation('commons-io:commons-io:2.11.0')
    shadowImplementation('commons-collections:commons-collections:3.2.2')
    shadowImplementation('org.apache.commons:commons-lang3:3.12.0')
    shadowImplementation('commons-codec:commons-codec:1.15')
    shadowImplementation('com.google.guava:guava:31.1-jre')

    // DynamicProxy
    shadowImplementation('dev.vankka:dynamicproxy-runtime:1.0.1')
    compileOnly('dev.vankka:dynamicproxy:1.0.1')
    annotationProcessor('dev.vankka:dynamicproxy:1.0.1')

    // MySQL
    compileOnly('mysql:mysql-connector-java:8.0.28')

    // Optional ForgeEssentials 1.7.10 permissions backend. Its distribution bundles JDA 5 and other libraries that
    // conflict with DiscordSRV's compile classpath, so compile against a filtered jar containing only FE classes.
    add('forgeEssentialsDistribution', 'curse.maven:forge-essentials-74735:6113618')
    compileOnly(files(forgeEssentialsApiJar))

    // Misc libraries
    shadowImplementation('com.vdurmont:emoji-java:5.1.1')
    shadowImplementation('com.github.zafarkhaja:java-semver:0.9.0')
    shadowImplementation('com.github.kevinsawicki:http-request:6.0')
    shadowImplementation('org.minidns:minidns-hla:1.0.4')
    shadowImplementation('com.hrakaroo:glob:0.9.0')
    shadowImplementation('org.springframework:spring-expression:5.3.16') {
        exclude(module: 'spring-jcl')
    }

    // JUnit
    testImplementation('org.junit.jupiter:junit-jupiter-api:5.14.3')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.14.3')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.14.3')

    compileOnly('com.google.code.findbugs:jsr305:3.0.2')
}
